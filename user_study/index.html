<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="视频生成结果用户调查：请观看视频并完成评分。"
    />
    <title>用户调查 | User Study</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">USER STUDY / 用户调查</p>
          <h1>视频质量评价</h1>
        </div>
        <div class="header-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      </header>

      <div id="app" class="app-content">
        <section id="intro-screen" class="panel intro-panel" aria-labelledby="intro-title">
          <div class="section-kicker">01 / 开始</div>
          <h2 id="intro-title">感谢参与本次调查</h2>
          <p class="intro-copy">
            接下来你会看到三个视频。请完整观看它们，并根据你的直观感受分别评分。
            你的昵称仅用于标记本次数据，不会用于其他用途。
          </p>

          <form id="nickname-form" class="nickname-form" novalidate>
            <label for="nickname">
              昵称
              <span class="label-note">仅用于标记数据</span>
            </label>
            <input
              id="nickname"
              name="nickname"
              type="text"
              maxlength="40"
              autocomplete="nickname"
              placeholder="请输入一个昵称"
              required
            />
            <p id="intro-error" class="form-message error-message" role="alert" hidden></p>
            <button class="primary-button" type="submit">
              开始调查
              <span aria-hidden="true">→</span>
            </button>
          </form>
        </section>

        <section id="study-screen" class="study-screen" hidden>
          <div class="study-heading">
            <div>
              <div class="section-kicker">02 / 观看</div>
              <h2>请完整观看三个视频</h2>
            </div>
            <div class="progress-chip" aria-label="视频完成进度">
              <span id="progress-count">0 / 3</span>
              <span class="progress-label">已完成</span>
            </div>
          </div>

          <p class="instruction-line">
            请根据视频内容进行观看。视频全部播放完成后，评分区域会自动出现。
          </p>

          <div id="video-grid" class="video-grid" aria-live="polite"></div>

          <div class="watch-footer">
            <p id="watch-status" class="watch-status" role="status"></p>
            <button id="skip-videos" class="secondary-button" type="button" hidden>
              跳过空视频，进入评分
            </button>
          </div>

          <section id="scoring-section" class="panel scoring-panel" aria-labelledby="scoring-title" hidden>
            <div class="section-kicker">03 / 评分</div>
            <div class="scoring-heading">
              <div>
                <h2 id="scoring-title">请为三个视频评分</h2>
                <p>每项分值为 0.1–5.0 分，分数越高代表表现越好。</p>
              </div>
              <span class="scale-badge">0.1 — 5.0</span>
            </div>

            <form id="scoring-form" novalidate>
              <div id="score-grid" class="score-grid"></div>
              <div class="submit-row">
                <p id="submit-message" class="form-message" role="status"></p>
                <button id="submit-button" class="primary-button" type="submit">
                  提交评分
                  <span aria-hidden="true">↗</span>
                </button>
              </div>
            </form>
          </section>
        </section>

        <section id="success-screen" class="panel success-panel" aria-labelledby="success-title" hidden>
          <div class="success-icon" aria-hidden="true">✓</div>
          <div class="section-kicker">COMPLETE / 完成</div>
          <h2 id="success-title">感谢你的参与</h2>
          <p id="success-message" class="intro-copy"></p>
          <button id="restart-button" class="secondary-button" type="button">重新开始</button>
        </section>
      </div>

      <footer class="site-footer">
        <span>Video quality study</span>
        <span>请勿提交个人敏感信息</span>
      </footer>
    </main>

    <script src="config.js?v=2"></script>
    <script src="app.js?v=2" defer></script>
  </body>
</html>
